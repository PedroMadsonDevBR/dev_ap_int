<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Cidade Inteligente - Cadastro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1329; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .container { width: 100%; max-width: 580px; background: #fff; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.35); overflow: hidden; display: flex; flex-direction: column; }
    .sidebar { display: none; }
    .header { background: linear-gradient(135deg, #0f2744, #0284c7); color: #fff; padding: 24px; text-align: center; }
    .header h1 { font-size: 22px; margin-bottom: 4px; }
    .header p { font-size: 13px; color: #e2e8f0; }
    form, .row { display: flex; flex-direction: column; gap: 14px; }
    form { padding: 24px; }
    .col { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; font-weight: 700; color: #334155; }
    .input-group { position: relative; display: flex; align-items: center; }
    .input-group .icon { position: absolute; left: 12px; color: #64748b; display: flex; pointer-events: none; transition: 0.3s; }
    .input-group svg { width: 18px; height: 18px; fill: currentColor; }
    .input-group input { width: 100%; height: 42px; padding: 0 12px 0 40px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s; }
    .input-group input:hover { border-color: #94a3b8; }
    .input-group input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.2); }
    .input-group:focus-within .icon { color: #0284c7; }
    .terms { font-size: 12.5px; color: #475569; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .terms input { width: 16px; height: 16px; accent-color: #0284c7; }
    .btns { display: flex; gap: 10px; }
    .btn { flex: 2; height: 44px; background: linear-gradient(135deg, #0f2744, #0284c7); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(2,132,199,0.35); }
    .btn-reset { flex: 1; height: 44px; background: transparent; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 13px; font-weight: 600; color: #64748b; cursor: pointer; transition: 0.3s; }
    .btn-reset:hover { background: #f1f5f9; color: #334155; }
    @media (min-width: 768px) { .row { flex-direction: row; } form { padding: 30px; } }
    @media (min-width: 1024px) {
      .container { max-width: 1080px; flex-direction: row; }
      .sidebar { display: flex; flex: 0 0 320px; background: #09152b; color: #f8fafc; padding: 36px; flex-direction: column; justify-content: space-between; }
      .sidebar h2 { font-size: 20px; color: #38bdf8; margin-bottom: 12px; }
      .sidebar p { font-size: 13.5px; line-height: 1.6; color: #94a3b8; }
      .form-area { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="container">
    <aside class="sidebar">
      <div><h2>Conecta Cidade</h2><p>Plataforma inteligente de governança urbana, mobilidade integrada e serviços públicos sustentáveis.</p></div>
      <p style="font-size:11.5px;color:#64748b;">© 2026 Conecta Cidade • LGPD</p>
    </aside>
    <div class="form-area">
      <header class="header"><h1>Cadastro no Portal do Cidadão</h1><p>Acesse serviços municipais unificados e mobilidade urbana</p></header>
      <form action="#" method="POST">
        <div class="row">
          <div class="col">
            <label for="nome">Nome Completo *</label>
            <div class="input-group"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span><input type="text" id="nome" name="nome" placeholder="Seu nome completo" required autocomplete="name"></div>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="email">E-mail *</label>
            <div class="input-group"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg></span><input type="email" id="email" name="email" placeholder="seu.email@cidade.gov.br" required autocomplete="email"></div>
          </div>
          <div class="col">
            <label for="telefone">Telefone com DDD *</label>
            <div class="input-group"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></span><input type="tel" id="telefone" name="telefone" placeholder="(11) 98765-4321" required pattern="^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$" autocomplete="tel"></div>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="cpf">CPF *</label>
            <div class="input-group"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm-6 10h-4v-2h4v2zm4-4H6V8h12v2z"/></svg></span><input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required pattern="^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$"></div>
          </div>
          <div class="col">
            <label for="bairro">Bairro / Região *</label>
            <div class="input-group"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></span><input type="text" id="bairro" name="bairro" placeholder="Ex: Centro / Setor Sul" required></div>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="senha">Senha *</label>
            <div class="input-group"><span class="icon"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></span><input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" minlength="8" required autocomplete="new-password"></div>
          </div>
          <div class="col">
            <label for="confirmar">Confirmar Senha *</label>
            <div class="input-group"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg></span><input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" minlength="8" required autocomplete="new-password"></div>
          </div>
        </div>
        <label class="terms"><input type="checkbox" required> Concordo com os Termos de Uso e Proteção de Dados (LGPD) *</label>
        <div class="btns">
          <button type="submit" class="btn">Cadastrar no Conecta Cidade</button>
          <button type="reset" class="btn-reset">Limpar</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
